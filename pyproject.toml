[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibetrace"
version = "0.1.0"
description = "Prompt-to-code provenance tracking for AI-assisted coding, with security correlation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "flask>=3.0",
    "semgrep>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
vibetrace = "vibetrace.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"vibetrace.dashboard" = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
